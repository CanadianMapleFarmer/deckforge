[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]
default-members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
authors = ["Gerhard Kloppers"]
repository = "https://github.com/CanadianMapleFarmer/deckforge"
homepage = "https://github.com/CanadianMapleFarmer/deckforge"

[workspace.dependencies]
deckforge-common = { path = "crates/common" }
deckforge-dsp = { path = "crates/dsp" }
deckforge-analysis = { path = "crates/analysis" }
deckforge-engine = { path = "crates/engine" }
deckforge-controller = { path = "crates/controller" }
deckforge-library = { path = "crates/library" }
deckforge-spotify = { path = "crates/spotify" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
crossbeam-channel = "0.5"
cpal = "0.18"
symphonia = { version = "0.6", features = ["all"] }
rtrb = "0.4"
triple_buffer = "9"
midir = "0.11"
rusqlite = { version = "0.40", features = ["bundled"] }
lofty = "0.25"
realfft = "3.5"
walkdir = "2.5"
quick-xml = "0.42"
cc = "1"
dirs = "7"
hound = "3.5"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
url = "2"
unicode-normalization = "0.1"
keyring = "3.6"
open = "5"

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
